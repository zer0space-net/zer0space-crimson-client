name: Build crimson client image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  # Guardrail: the SPA has to type-check and build. `npm run build` is
  # `tsc -b && vite build`, so a type error or a broken import fails here rather
  # than shipping a blank page.
  check:
    runs-on: ubuntu-latest
    steps:
      # crimson-sources is vendored (committed under vendor/), not a submodule, so
      # a plain same-org checkout is all that's needed — no cross-org token.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The built-in GITHUB_TOKEN (with packages:write above) can create and push
      # this package, because it is created by — and auto-links to — this repo.
      # No org secret needed. (The dashboard uses CR_PAT only because its package
      # predates its repo; a fresh package like this one doesn't.)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zer0space-net/zer0space-crimson-client:latest
            ghcr.io/zer0space-net/zer0space-crimson-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
