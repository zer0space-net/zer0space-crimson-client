name: Build crimson client image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  # Guardrail: the SPA has to type-check and build. `npm run build` is
  # `tsc -b && vite build`, so a type error or a broken import fails here rather
  # than shipping a blank page.
  check:
    runs-on: ubuntu-latest
    steps:
      # CR_PAT (a personal token, valid for public repos in any org) clones the
      # crimson-sources submodule. The default GITHUB_TOKEN is scoped to
      # zer0space-net and is rejected by crimsonhaven-to; anonymous clones are
      # rate-limited from Actions runners — both fail. See the build job note.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CR_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CR_PAT }}

      # CR_PAT (classic PAT with write:packages), matching zer0space-dashboard —
      # GITHUB_TOKEN only writes to packages linked to this exact repo.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zer0space-net/zer0space-crimson-client:latest
            ghcr.io/zer0space-net/zer0space-crimson-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
