# zer0space ✕ Crimson — web client deploy stack.
#
# CREDIT: Crimson Haven (https://github.com/crimsonhaven-to) develops the backend
# and the streaming engine this client embeds. The frontend in this repo is
# zer0space's; everything it plays comes from Crimson Haven.
#
# TOPOLOGY: the client is NOT public. It is reached only through the zer0space
# dashboard's /crimson gate, which checks the session and reverse-proxies here
# over the shared `crimson_net` overlay. So this service joins crimson_net (not
# cloudflared_proxy) and exposes no port and no hostname of its own — the only
# way in is being signed in to zer0space. Media never transits here anyway
# (Cloudflare ToS §2.8): stream bytes go CDN → crimson-proxy → viewer.
#
# The shared overlay must exist before the first deploy (external to every stack,
# created once on a manager, so the dashboard and both crimson stacks can find
# each other by service alias):
#
#   docker network create --driver overlay --attachable crimson_net
#
# Stateless: no volumes, no placement constraint — runs on any node.

services:
  client:
    image: ghcr.io/zer0space-net/zer0space-crimson-client:latest
    networks:
      crimson_net:
        # Stable name the dashboard's CRIMSON_CLIENT_URL points at, independent
        # of the Portainer stack name.
        aliases:
          - zer0space-crimson-client
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 96M
        reservations:
          cpus: '0.02'
          memory: 24M
      update_config:
        # start-first: bring the new task up before stopping the old one, so a
        # redeploy causes no visible interruption behind the gate.
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

networks:
  crimson_net:
    external: true
