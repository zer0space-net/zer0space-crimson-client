# Serves the built SPA. The /crimson prefix lives only at the dashboard boundary:
# the dashboard strips it and forwards the remainder here, so this server answers
# plain /, /assets/… and /index.html. Content-Security-Policy is set by the
# dashboard proxy on the way out (scoped to /crimson), not here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Swarm healthcheck target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build assets — safe to cache hard and forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry document must never be cached, or a redeploy is invisible until
    # the browser's copy expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: a deep link like /catalogue is a client route, not a file, so
    # unknown paths return index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
